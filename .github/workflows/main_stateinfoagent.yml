# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - stateinfoagent

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 🛠️ Local Build Section (Optional)
      # The following section in your workflow is designed to catch build issues early on the client side, before deployment. This can be helpful for debugging and validation. However, if this step significantly increases deployment time and early detection is not critical for your workflow, you may remove this section to streamline the deployment process.
      - name: Create and Start virtual environment and Install dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt
                
      # By default, when you enable GitHub CI/CD integration through the Azure portal, the platform automatically sets the SCM_DO_BUILD_DURING_DEPLOYMENT application setting to true. This triggers the use of Oryx, a build engine that handles application compilation and dependency installation (e.g., pip install) directly on the platform during deployment. Hence, we exclude the antenv virtual environment directory from the deployment artifact to reduce the payload size. 
      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !antenv/

      # 🚫 Opting Out of Oryx Build
      # If you prefer to disable the Oryx build process during deployment, follow these steps:
      # 1. Remove the SCM_DO_BUILD_DURING_DEPLOYMENT app setting from your Azure App Service Environment variables.
      # 2. Refer to sample workflows for alternative deployment strategies: https://github.com/Azure/actions-workflow-samples/tree/master/AppService
      

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1601495E414B42F6BCD415BD497AB83D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D2D880BAACFD46C088FCAFF2469773E2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C029C22886A049B29903028FF0DB4FE4 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'stateinfoagent'
          slot-name: 'Production'

  evals:
    name: Run StateInfoAgent Evals
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-evals.txt

      - name: Wait for Azure App Service
        env:
          AGENT_EVAL_URL: ${{ vars.AGENT_EVAL_URL }}
        run: |
          python - <<'PY'
          import os
          import time
          import httpx

          base_url = os.environ["AGENT_EVAL_URL"].rstrip("/")

          for attempt in range(1, 31):
              try:
                  response = httpx.get(
                      f"{base_url}/health",
                      timeout=15
                  )
                  response.raise_for_status()
                  if response.json().get("status") == "healthy":
                      print("StateInfoAgent is healthy")
                      break
              except (httpx.HTTPError, ValueError):
                  pass

              if attempt == 30:
                  raise RuntimeError(
                      "StateInfoAgent did not become healthy"
                  )

              print(f"Waiting for agent: {attempt}/30")
              time.sleep(10)
          PY

      - name: Run AI Evaluations
        env:
          AGENT_EVAL_URL: ${{ vars.AGENT_EVAL_URL }}
        run: |
          python -m pytest evals/ -v \
            --html=eval-report.html \
            --self-contained-html \
            --junitxml=eval-results.xml

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stateinfoagent-eval-results
          path: |
            eval-report.html
            eval-results.xml
          if-no-files-found: warn
          
          
